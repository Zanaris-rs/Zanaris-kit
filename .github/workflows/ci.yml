name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes: CI checks out, builds and tests. A pull request from a
# fork gets a token that can do no more than read this repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
