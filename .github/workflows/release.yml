name: Release

# A push of tag v<version> builds every platform and drafts a GitHub Release
# holding the artifacts; the owner publishes it. A manual dispatch is always
# the dry run, whatever ref it runs on: the same build, the artifacts on the
# workflow run, no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    name: Stage the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Before the stage, which takes minutes: a release that cannot pass its
      # own checks should fail in the first job, not after three packagings.
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/stage-engine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: engine-dist
          # The pack's .cache directory is load-bearing engine data, and v4 drops hidden files.
          include-hidden-files: true
          retention-days: 7
          compression-level: 1

  build:
    name: Build (${{ matrix.os }})
    needs: engine
    strategy:
      fail-fast: false
      # One draft release, which electron-builder creates when it finds none: the legs must not race.
      max-parallel: 1
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: engine-dist
      - name: Tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run build
      - name: Package and draft the release
        if: github.event_name == 'push'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package (dry run)
        if: github.event_name != 'push'
        run: npx electron-builder --publish never
      # npm run dist checks this locally, but the release path calls electron-builder
      # directly: electron-builder drops the top-level node_modules of a copy root, so
      # an engine can package with every source file and no dependency at all.
      - name: Packaged engine is complete
        shell: bash
        run: |
          engine=$(find release -type d -path '*/engine' -name engine | grep -E '(Resources|resources)/engine$' | head -1)
          [ -n "$engine" ] || { echo "no packaged engine directory under release/"; exit 1; }
          for f in src/app.js node_modules/fastify/package.json data/pack/.cache/maps-server.zip; do
            [ -f "$engine/$f" ] || { echo "packaged engine is incomplete: missing $f under $engine"; exit 1; }
          done
          echo "packaged engine complete at $engine"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: zanaris-kit-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
