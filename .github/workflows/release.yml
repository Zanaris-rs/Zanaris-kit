name: Release

# A push of tag v<version> builds every platform and drafts a GitHub Release
# holding the artifacts; the owner publishes it. A manual dispatch is always
# the dry run, whatever ref it runs on: the same build, the artifacts on the
# workflow run, no release. The kit carries no engine: single player's builds
# are published by the Engines workflow and pinned in engines/.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Before packaging, which takes three runners: a release that cannot pass
      # its own checks should fail here, not after them.
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      # One draft release, which electron-builder creates when it finds none: the legs must not race.
      max-parallel: 1
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm run build
      - name: Package and draft the release
        if: github.event_name == 'push'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package (dry run)
        if: github.event_name != 'push'
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'push'
        with:
          name: zanaris-kit-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
